<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mrs. Davidson's Final Countdown</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", cursive, sans-serif;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.06) 0 2px, transparent 3px),
      radial-gradient(circle at 70% 45%, rgba(255,255,255,0.05) 0 2px, transparent 3px),
      linear-gradient(180deg, #2f4858 0%, #1d2d36 100%);
    color: #fdf6e3;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(29, 45, 54, 0.95);
    border-bottom: 4px solid #d8a000;
    text-align: center;
    padding: 14px 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.7rem;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 2px 0 #d8a000, 0 0 12px rgba(255, 208, 0, 0.35);
  }
  .subtitle { font-style: italic; color: #e8d9a0; margin-top: 2px; font-size: .95rem; }
  .countdown {
    margin-top: 8px;
    font-size: 1.35rem;
    font-weight: 700;
    color: #ffd93d;
  }
  .countdown small { display: block; font-size: .7rem; color: #b8c9d0; font-weight: 400; text-transform: uppercase; letter-spacing: 2px; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    max-width: 640px;
    margin: 18px auto 4px;
    padding: 0 16px;
    font-size: .8rem;
    color: #d7e2e8;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch {
    width: 16px; height: 16px; border-radius: 4px;
    display: inline-block;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.2);
  }

  .summary {
    text-align: center;
    margin: 8px auto 16px;
    font-size: .95rem;
    font-weight: 600;
    color: #ffe066;
  }

  .heatmap {
    display: flex;
    flex-direction: column;
    gap: 24px;
    width: min(440px, 100%);
    margin: 0 auto 40px;
    padding: 0 16px;
  }

  .month-label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: .78rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ffe066;
  }
  .month-label::after {
    content: "";
    flex: 1;
    height: 2px;
    background: rgba(255, 217, 61, 0.25);
  }

  .month {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
  }

  .cell {
    aspect-ratio: 1;
    min-width: 0;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .8rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.15), 0 3px 8px rgba(0,0,0,.22);
    user-select: none;
    position: relative;
  }
  .cell.placeholder { background: transparent; box-shadow: none; }

  .cell.done {
    filter: grayscale(.6) brightness(.62);
    opacity: .55;
    box-shadow: none;
  }

  .cell.today {
    border: 2px solid #fff;
    box-shadow: 0 0 18px 4px rgba(255,255,255,.75), inset 0 -3px 0 rgba(0,0,0,.15);
    animation: pulse 1.2s ease-in-out infinite;
    z-index: 2;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.09); }
  }

  .cell.holiday {
    background: linear-gradient(180deg, #ffd700 0%, #ff9d00 100%);
    color: #6b3d00;
    text-shadow: none;
    flex-direction: column;
    gap: 1px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), 0 3px 8px rgba(255, 170, 0, .25);
  }
  .cell.holiday .hic { font-size: .8rem; line-height: 1; }
  .cell.holiday .hday { font-size: .95rem; line-height: 1; font-weight: 800; }

  .cell.summer {
    grid-column: 1 / -1;
    aspect-ratio: auto;
    min-height: 46px;
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    padding: 6px;
    border-radius: 10px;
    background: radial-gradient(circle at 30% 30%, #fff3a0, #ffd93d 45%, #ff9d00);
    color: #7a4a00;
    text-shadow: none;
    font-size: .85rem;
    font-weight: 800;
    letter-spacing: 1px;
    border: 2px solid #fff;
    box-shadow: 0 0 30px 6px rgba(255, 215, 0, .5), inset 0 -3px 0 rgba(0,0,0,.15);
  }

  @media (max-width: 480px) {
    .month { gap: 4px; }
    .cell { border-radius: 6px; font-size: .7rem; }
    .cell.holiday .hic { font-size: .72rem; }
    .cell.holiday .hday { font-size: .85rem; }
    .cell.summer { font-size: .78rem; min-height: 40px; }
  }
</style>
</head>
<body>
  <header>
    <h1>Mrs. Davidson's Final Countdown</h1>
    <p class="subtitle">Last year before retirement · GGUSD 2026–2027</p>
    <div class="countdown" id="countdown">--</div>
  </header>

  <div class="legend">
    <span><i class="swatch" style="background:#5c6a72"></i> Done</span>
    <span><i class="swatch" style="background:#fff; box-shadow:0 0 8px #fff"></i> Today</span>
    <span><i class="swatch" style="background:#4fc3f7"></i> Upcoming</span>
    <span><i class="swatch" style="background:#ffd700"></i> No School</span>
    <span><i class="swatch" style="background:radial-gradient(circle at 30% 30%, #fff3a0, #ffd93d 45%, #ff9d00)"></i> Summer!</span>
  </div>

  <div class="summary" id="summary">--</div>

  <div class="heatmap" id="map"></div>

<script>
  const YEAR_START = "2026-08-10";
  const YEAR_END = "2027-05-25";

  const HOLIDAYS = [
    { name: "Labor Day",        start: "2026-09-07",  end: "2026-09-07",  icon: "🏈" },
    { name: "Veterans Day",     start: "2026-11-11",  end: "2026-11-11",  icon: "🇺🇸" },
    { name: "Thanksgiving",     start: "2026-11-23",  end: "2026-11-27",  icon: "🦃" },
    { name: "Winter Break",     start: "2026-12-21",  end: "2027-01-01",  icon: "❄️" },
    { name: "MLK Jr. Day",      start: "2027-01-18",  end: "2027-01-18",  icon: "🕊️" },
    { name: "Lincoln's Bday",   start: "2027-02-12",  end: "2027-02-12",  icon: "🎩" },
    { name: "Presidents' Day",  start: "2027-02-15",  end: "2027-02-15",  icon: "🏛️" },
    { name: "Spring Break",     start: "2027-03-15",  end: "2027-03-19",  icon: "🌸" }
  ];

  const MONTH_COLORS = {
    8:  ["#ff6b6b", "#ee5a24"],
    9:  ["#ffa502", "#e67e22"],
    10: ["#a55eea", "#8e44ad"],
    11: ["#d37a3a", "#a0501a"],
    12: ["#4fc3f7", "#0288d1"],
    1:  ["#26c6da", "#00897b"],
    2:  ["#f06292", "#d81b60"],
    3:  ["#66bb6a", "#388e3c"],
    4:  ["#ffee58", "#f9a825"],
    5:  ["#ff7043", "#e64a19"]
  };

  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function parse(d) { const [y, m, day] = d.split("-").map(Number); return new Date(Date.UTC(y, m - 1, day)); }
  function key(d) { return d.toISOString().slice(0, 10); }
  function weekday(d) { return d.getUTCDay(); }

  function isHoliday(d) {
    const k = key(d);
    for (const h of HOLIDAYS) {
      if (k >= h.start && k <= h.end) return h;
    }
    return null;
  }

  function buildTimeline() {
    const items = [];
    const cursor = parse(YEAR_START);
    const end = parse(YEAR_END);
    while (cursor <= end) {
      const dow = weekday(cursor);
      if (dow === 0 || dow === 6) { cursor.setUTCDate(cursor.getUTCDate() + 1); continue; }

      const h = isHoliday(cursor);
      if (h) {
        items.push({ type: "holiday", name: h.name, icon: h.icon, date: key(cursor) });
      } else {
        items.push({ type: "day", date: key(cursor) });
      }
      cursor.setUTCDate(cursor.getUTCDate() + 1);
    }
    return items;
  }

  const timeline = buildTimeline();

  function buildMonths() {
    const months = [];
    for (const it of timeline) {
      const idx = parse(it.date).getUTCMonth();
      let m = months[months.length - 1];
      if (!m || m.index !== idx) {
        m = { index: idx, name: MONTHS[idx], items: [] };
        months.push(m);
      }
      m.items.push(it);
    }
    months[months.length - 1].items.push({ type: "summer" });
    return months;
  }

  const months = buildMonths();

  function progress(todayKey) {
    let total = 0, done = 0;
    for (const it of timeline) {
      if (it.type !== "day") continue;
      total++;
      if (it.date < todayKey) done++;
    }
    return { total, done, left: total - done };
  }

  function render() {
    const today = new Date();
    const todayKey = key(today);
    const target = parse(YEAR_END);

    const countdown = document.getElementById("countdown");
    const diff = target - today;
    const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
    countdown.innerHTML = (days > 0 ? days : 0) + " days until summer" +
      (days > 0 ? " <small>Mrs. Davidson's last year before retirement</small>" : " <small>Happy retirement, Mrs. Davidson! 🎉</small>");

    const p = progress(todayKey);
    document.getElementById("summary").textContent =
      p.done + " of " + p.total + " school days done · " + p.left + " left";

    const map = document.getElementById("map");
    map.innerHTML = "";

    for (const m of months) {
      const block = document.createElement("div");
      block.className = "month-block";

      const label = document.createElement("div");
      label.className = "month-label";
      label.textContent = m.name;
      block.appendChild(label);

      const grid = document.createElement("div");
      grid.className = "month";
      block.appendChild(grid);

      const pad = weekday(parse(m.items[0].date)) - 1;
      for (let i = 0; i < pad; i++) {
        const ph = document.createElement("div");
        ph.className = "cell placeholder";
        grid.appendChild(ph);
      }

      for (const it of m.items) {
        if (it.type === "summer") {
          const el = document.createElement("div");
          el.className = "cell summer";
          el.innerHTML = "☀️ Summer! · Retirement";
          grid.appendChild(el);
          continue;
        }

        const el = document.createElement("div");
        el.className = "cell";
        const d = parse(it.date);

        if (it.type === "holiday") {
          el.classList.add("holiday");
          el.innerHTML = '<span class="hic">' + it.icon + '</span><span class="hday">' + d.getUTCDate() + '</span>';
          el.title = it.name + " · " + it.date;
        } else {
          const [r, g] = MONTH_COLORS[d.getUTCMonth() + 1];
          el.style.background = "linear-gradient(180deg, " + r + " 0%, " + g + " 100%)";
          el.textContent = d.getUTCDate();
          el.title = MONTHS[d.getUTCMonth()] + " " + d.getUTCDate();
        }

        if (it.date < todayKey) el.classList.add("done");
        if (it.date === todayKey) {
          el.classList.add("today");
          el.title = (it.type === "holiday" ? it.name + " · " : "Today · ") + it.date;
        }
        grid.appendChild(el);
      }

      const tail = grid.children.length % 5;
      for (let i = 0; i < (tail ? 5 - tail : 0); i++) {
        const ph = document.createElement("div");
        ph.className = "cell placeholder";
        grid.appendChild(ph);
      }

      map.appendChild(block);
    }

    const active = map.querySelector(".cell.today");
    if (active) active.scrollIntoView({ block: "center" });
  }

  render();
  setInterval(render, 60000);
</script>
</body>
</html>
